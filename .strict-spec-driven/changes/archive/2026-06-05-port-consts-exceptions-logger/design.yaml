schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-consts-exceptions-logger
approach:
  - 'Port Python modules to idiomatic TypeScript: consts uses readonly arrays/tuples and const assertions, exceptions use ES class extends Error, logger uses console-based implementation with configurable log level via env var. Re-export all from index.ts.'
decisions:
  logger-impl:
    decision: Console-based logger instead of porting Python logging module
    rationale: Node.js/Bun don't have Python's logging module. A simple console-based logger with level filtering via MOOTDX_LOG_LEVEL env var matches the original behavior without adding dependencies.
alternatives: []
risks: []
