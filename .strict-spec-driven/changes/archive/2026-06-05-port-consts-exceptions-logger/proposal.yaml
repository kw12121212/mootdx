    - Port consts.ts (market IDs, kline types, frequency map, server hosts, block constants, limits, config defaults), exceptions.ts (MootdxError, MootdxValidationError, MootdxModuleNotFoundError, FileNeedRefresh), and logger.ts (createLogger with debug/info/warn/error levels) from Python originals
