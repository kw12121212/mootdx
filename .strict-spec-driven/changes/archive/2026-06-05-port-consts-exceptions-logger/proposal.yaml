    - These three modules are foundational infrastructure used by all higher-level modules (protocol, quotes, reader, affair, config, utils)
scope:
  in:
    - mootdx-ts/src/consts.ts, mootdx-ts/src/exceptions.ts, mootdx-ts/src/logger.ts (new files), mootdx-ts/src/index.ts (update exports)
  out:
    - Protocol implementation, network I/O, CLI commands, price adjustment
unchanged_behavior:
  - All existing Python codebase and specs remain untouched
