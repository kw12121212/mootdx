schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-financial-columns
approach:
  - 'Port columns.ts as a flat string array with 583 entries. Port base.ts with struct unpack helpers using Buffer read methods. Port FinancialReader with binary .dat parsing: read header (2hI1H3L), iterate stock items (6s1c1L), unpack report fields as float32 array. Port FinancialList using existing getReportFileBySize for tdxfin/gpcw.txt. Port Financial using getReportFileBySize for individual files. Handle .zip extraction using Bun''s built-in or tempdir approach.'
decisions:
  binary-format:
    decision: Use Buffer read methods (readFloatLE, readUInt32LE, readInt16LE) instead of Python struct.unpack for parsing the binary financial .dat format
    rationale: TypeScript has no struct module; Buffer methods provide equivalent functionality
  zip-handling:
    decision: Use Bun's ability to spawn unzip or Node's zlib for .zip extraction to temp directory
    rationale: Python uses shutil.unpack_archive; Bun/Node needs equivalent
  dataframe-replacement:
    decision: Return typed object arrays with column names as keys instead of pandas DataFrames
    rationale: TypeScript has no DataFrame; typed arrays are idiomatic
alternatives: []
risks: []
