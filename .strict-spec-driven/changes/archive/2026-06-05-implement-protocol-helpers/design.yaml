schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: implement-protocol-helpers
approach:
  - Port pytdx/helper.py getPrice and getVolume to TypeScript using DataView/Buffer. getPrice reads variable-length bytes with sign bit and continuation bit. getVolume reconstructs floats from packed int32 mantissa/exponent. getDatetime parses variable-length date encoding. All functions return value + bytesConsumed for chained parsing.
decisions:
  buffer-api:
    decision: Use Node.js Buffer API for binary reading instead of DataView
    rationale: Buffer is the standard binary API in Node.js/Bun and matches the Python bytes/bytearray pattern used in pytdx
alternatives: []
risks: []
