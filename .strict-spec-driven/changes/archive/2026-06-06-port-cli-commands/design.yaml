schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-cli-commands
approach:
  - Single cli/index.ts with Commander.js program and subcommands. Each command wraps existing library API calls. Use console.table for output formatting. No external CLI dependencies needed beyond commander.
decisions:
  no-external-cli-libs:
    decision: Skip cli-table3, cli-progress, ora - use console.table and console.log instead to minimize dependencies
    rationale: CLI is a thin wrapper. commander is already likely available or small. Console formatting is sufficient for CLI output.
alternatives: []
risks: []
