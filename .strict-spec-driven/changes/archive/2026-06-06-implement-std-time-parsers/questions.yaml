resolved:
  - id: gbk-decoding
    question: Should company_info and block parsers use iconv-lite for GBK decoding, or rely on TextDecoder('gbk') which is available in Bun?
    context: Company info category names and block names are GBK-encoded in TDX protocol. Bun supports TextDecoder with gb2312/gbk labels.
    answer: Use TextDecoder('gbk') which is natively supported in Bun. No external dependency needed.
    status: resolved
