change: implement-std-time-parsers
approach:
  - Create separate parser files in protocol/ for each command. Each exports a request builder (Buffer) and response parser function. Share getPrice/getTime/getDatetime helpers from helpers.ts. Follow existing pattern from security_bars.ts and security_quotes.ts.
decisions:
  separate-files:
    decision: One file per command group (minute_time.ts, transaction.ts, xdxr.ts, finance.ts, company_info.ts, block.ts, report_file.ts)
    rationale: Mirrors existing std parser organization and keeps each parser independently testable
alternatives: []
risks: []
