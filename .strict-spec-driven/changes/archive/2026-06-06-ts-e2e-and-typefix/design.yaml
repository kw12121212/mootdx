schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: ts-e2e-and-typefix
approach:
  - 'Fix 4 TypeScript encoding errors by creating a shared decodeGBK utility that uses iconv-lite (already a dependency) instead of TextDecoder for GB2312 decoding. Add e2e tests that exercise the public API through src/index.ts without hitting real TDX servers, covering: config creation, server hosts, stock code parsing, offline reader parsing with fixture data, financial column definitions, holiday calendar checks, and factor/adjust utilities.'
decisions:
  shared-decodegbk:
    decision: Replace scattered TextDecoder('gb2312') calls with a single decodeGBK function using iconv-lite, which is already a project dependency and properly supports GB2312 encoding. This eliminates the type errors and consolidates encoding logic.
    rationale: TextDecoder in Bun/Node does not officially support 'gb2312' as a valid Encoding value, causing TS2345 errors. iconv-lite is already declared in package.json and is the standard Node.js solution for legacy Chinese encodings.
