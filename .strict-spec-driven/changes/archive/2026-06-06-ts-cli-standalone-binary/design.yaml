schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: ts-cli-standalone-binary
approach:
  - Use 'bun build --compile' to produce a single standalone executable from the CLI entry point. The existing Commander-based CLI already provides --help via .description() on each command. Add a 'build:cli' script to package.json that compiles src/cli/index.ts into a standalone binary named 'mootdx'. Ensure the shebang line is preserved.
decisions:
  compile-approach:
    decision: Use bun build --compile for single-binary output
    rationale: Bun's compile mode produces a single self-contained executable embedding the Bun runtime. This avoids requiring users to install any runtime. Commander already provides --help for all commands.
alternatives: []
risks: []
