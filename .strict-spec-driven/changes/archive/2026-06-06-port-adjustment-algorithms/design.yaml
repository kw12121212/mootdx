schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-adjustment-algorithms
approach:
  - Port reversion.ts with all adjustment functions operating on OhlcBar[] arrays instead of DataFrames. Port adjust.ts with toAdjust/toAdjust2 dispatchers that call StdQuotes.xdxr() and fqFactor(). Factor data fetched from Sina Finance API via fetch(). Use file cache for xdxr data. ETF detection by code prefix (15/16/50/51).
decisions:
  data-structure:
    decision: Operate on OhlcBar[] arrays with date-based lookups instead of pandas DataFrame index operations
    rationale: TypeScript has no DataFrame; arrays of typed objects are idiomatic
  factor-source:
    decision: Fetch qfq/hfq factors from Sina Finance API via fetch(), parse JSON response
    rationale: Python uses httpx; Bun has native fetch
  caching:
    decision: Cache xdxr data to ~/.mootdx/xdxr/{symbol}.json using existing fileCache utility
    rationale: Python uses file_cache decorator; we have equivalent in cache/file.ts
alternatives: []
risks: []
