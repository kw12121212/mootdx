schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-affair
approach:
  - Port Affair as a class with static async methods. files() delegates to FinancialList.fetchAndParse(). fetch(downdir, filename?) handles single file download or async batch. parse(downdir, filename) ensures file exists then delegates to FinancialReader.toData(). MD5 skip uses crypto.createHash('md5'). Async batch uses Promise.all with concurrency control.
decisions:
  async-model:
    decision: Use Promise.all for batch downloads instead of Python asyncio.wait; no event loop management needed in Node
    rationale: TypeScript/Bun has native Promise support, no need for asyncio event loop
  progress-bar:
    decision: Accept optional progress callback instead of TqdmUpTo; caller provides UI
    rationale: No TqdmUpTo equivalent in TS; the library should remain UI-agnostic
alternatives: []
risks: []
