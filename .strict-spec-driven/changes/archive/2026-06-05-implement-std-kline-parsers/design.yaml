change: implement-std-kline-parsers
approach:
  - Port both parsers as standalone functions that take TdxBaseApi + params and return typed arrays. Shared price reconstruction logic via calPrice1000 helper. Index bars adds upCount/downCount fields.
decisions:
  shared-request-format:
    decision: Both parsers use identical request packet format, only response parsing differs
    rationale: Python uses identical setParams() for both; only parseResponse differs by 4 bytes for index bars. Sharing request builder avoids duplication.
