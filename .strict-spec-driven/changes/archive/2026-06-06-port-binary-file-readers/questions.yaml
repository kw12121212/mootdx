resolved:
  - id: security-coefficients
    question: Should the daily bar reader apply security-type-specific price coefficients (0.01 for A-shares, 0.001 for funds, 1.0 for indexes) or return raw values?
    context: Python applies coefficients based on stock type detection (A-share vs index vs fund vs bond). Raw values are simpler but don't match expected price levels.
    answer: Apply security-type-specific coefficients matching the Python implementation. Detect type from filename prefix (sh6->SH_A, sh0/sh88/sh99->SH_INDEX, sz00/sz30->SZ_A, etc.) and apply corresponding price/volume multipliers.
    status: resolved
