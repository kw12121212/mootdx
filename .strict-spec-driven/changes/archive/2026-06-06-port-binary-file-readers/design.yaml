change: port-binary-file-readers
approach:
  - Create reader.ts with ReaderBase abstract class handling path resolution (vipdoc/{market}/{subdir}/{symbol}.{suffix}), 4 binary format parser functions for .day/.lc1/.lc5/.1/.5 files, StdReader and ExtReader subclasses, and reader() factory function
decisions:
  single-file:
    decision: All reader code in one reader.ts file since the binary format parsers are small (each ~30 lines)
    rationale: Readers are tightly coupled around path resolution and binary parsing; keeping them together reduces import complexity
