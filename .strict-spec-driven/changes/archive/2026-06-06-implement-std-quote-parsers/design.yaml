schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: implement-std-quote-parsers
approach:
  - 'Three independent parser modules following the established pattern from security_bars.ts: each module exports a build*Request() function for constructing the binary request buffer, a parse*Response() function for decoding the binary response body, and an async get*() function that orchestrates sendRequest + parse. security_quotes uses getPrice() for price fields relative to last_close. security_count reads a single U16. security_list reads fixed-size records with GBK-decoded name strings.'
decisions:
  parser-structure:
    decision: Follow the same triptych pattern (buildRequest/parseResponse/get) as security_bars.ts for consistency
    rationale: All existing protocol parsers use this pattern, maintaining uniformity across the codebase
alternatives: []
risks: []
