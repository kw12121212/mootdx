change: define-shared-types
approach:
  - Define TypeScript interfaces and enums in a single src/types.ts file matching Python data structures. Use const enums for Market to enable efficient compilation. Export Frequency as a type alias. Re-export all from src/index.ts.
decisions:
  types-file-location:
    decision: Single types.ts file for all shared interfaces rather than per-module files
    rationale: At this early stage the number of types is small (~12 interfaces + 2 enums). A single file keeps imports simple and avoids premature fragmentation.
