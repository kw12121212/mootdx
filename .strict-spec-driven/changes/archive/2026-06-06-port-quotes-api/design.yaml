schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-quotes-api
approach:
  - Create quotes.ts with BaseQuotes abstract class handling connection lifecycle (config, server resolution, reconnect, close), StdQuotes subclass with 18 methods wrapping protocol parsers, ExtQuotes subclass with 11 methods with p-retry (3 attempts, random wait). Factory function quotes() returns StdQuotes or ExtQuotes based on market param.
decisions:
  class-hierarchy:
    decision: Use abstract BaseQuotes class with StdQuotes and ExtQuotes subclasses, mirroring Python's class hierarchy
    rationale: Matches the Python API structure exactly, enabling straightforward port and familiar API for existing mootdx users
alternatives: []
risks: []
