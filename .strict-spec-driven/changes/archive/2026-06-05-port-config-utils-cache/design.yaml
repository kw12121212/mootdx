schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: port-config-utils-cache
approach:
  - Port utils as standalone functions in src/utils/index.ts. get_stock_market uses prefix rules matching Python. md5sum uses Node.js crypto. to_file supports CSV (via string building) and JSON only. stock_bj_a uses httpx/fetch. Cache modules use JSON files instead of pickle, Map with timestamps for LRU, and console.time wrapper for timeit.
decisions:
  to-file-scope:
    decision: Limit to_file to CSV and JSON formats only, skip XLSX/HDF5
    rationale: pandas to_excel/to_hdf have no direct TS equivalent in a lightweight package. CSV and JSON cover the common use cases without adding heavy dependencies.
alternatives: []
risks: []
