schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: port-cli-commands
  milestone: 0007-cli
status: planned
summary: Port all CLI commands using Commander.js with table/progress/spinner
details: |
  mootdx-ts/src/cli/index.ts - Port from mootdx/__main__.py.

  Root program: mootdx
    --version: print version from package.json
    --verbose: set MOOTDX_LOG_LEVEL=debug

  Subcommands:
    quotes: -o/--output, -s/--symbol (default 600000), -a/--action (default bars),
      -m/--market (default std)
      Actions: bars, index, quotes, minute, transaction, F10, xdxr, finance, block

    reader: -d/--tdxdir, -s/--symbol, -a/--action (default daily), -m/--market (default std),
      -o/--output
      Actions: daily, minute, fzline, block, block_new

    bestip: -l/--limit (default 5), -v/--verbose
      Async server testing with ora spinner during tests
      cli-table3 output: server name, IP, port, latency

    affair: -p/--parse, -f/--fetch, -a/--downall, -o/--output,
      -d/--downdir (default output), -l/--listfile, -v/--verbose
      cli-progress for download progress bars

    bundle: -o/--output (default bundle), -s/--symbol (comma-separated list),
      -a/--action (default bars), -m/--market (default std), -e/--extension (default csv)
      Iterates symbol.split(','), calls to_file() for each

  Register: "bin": { "mootdx": "./dist/cli/index.js" }
  Libraries: commander, cli-table3, cli-progress, ora
depends_on:
  - port-quotes-api
  - port-block-customize
  - port-affair
  - port-factor-holiday-tools
