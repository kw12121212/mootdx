schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: port-consts-exceptions-logger
  milestone: 0001-project-scaffold
status: complete
summary: Port consts.ts, exceptions.ts, logger.ts from Python originals
details: |
  Port mootdx/consts.py -> mootdx-ts/src/consts.ts:
    - MARKET_SZ=0, MARKET_SH=1, MARKET_BJ=2 as const
    - KLINE_5MIN=0 through KLINE_YEARLY=11 as const
    - FREQUENCY array: ['5m','15m','30m','1h','day','week','mon','ex_1m','1m','dk','3mon','year']
    - FREQUENCY_MAP: Record<string, number> mapping string->index and number->number
    - HQ_HOSTS: 37 [name, ip, port] tuples (port 7709)
    - EX_HOSTS: 3 tuples (port 7720)
    - GP_HOSTS: 1 tuple (port 7709)
    - BLOCK_SZ, BLOCK_FG, BLOCK_GN, BLOCK_DEFAULT filenames
    - MAX_TRANSACTION_COUNT=2000, MAX_KLINE_COUNT=800
    - CONFIG default object with SERVER/BESTIP/TDXDIR structure

  Port mootdx/exceptions.py -> mootdx-ts/src/exceptions.ts:
    - MootdxError extends Error
    - MootdxValidationError extends MootdxError
    - MootdxModuleNotFoundError extends MootdxError
    - FileNeedRefresh extends MootdxError

  Port mootdx/logger.py -> mootdx-ts/src/logger.ts:
    - createLogger(name: string): Logger with debug/info/warn/error methods
    - Level controlled by MOOTDX_LOG_LEVEL env var (default: info)
    - Format: [mootdx:module] LEVEL message
depends_on:
  - scaffold-bun-project
