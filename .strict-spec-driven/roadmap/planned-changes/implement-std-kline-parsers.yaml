schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: implement-std-kline-parsers
  milestone: 0002-tdx-protocol
status: complete
summary: 'Implement K-line parsers: get_security_bars (0x052d) and get_index_bars'
details: |
  mootdx-ts/src/protocol/security_bars.ts:
    Request struct: magic(U16) + cmd_id(U32=0x01016408) + len1(U16) + len2(U16)
      + cmd_word(U16=0x052d) + market(U16) + code(6-byte ASCII) + category(U16)
      + padding(U16=1) + start(U16) + count(U16) + padding(U32 x2) + padding(U16)
    Response: count(U16) then per-record: getDatetime() + getPrice() x4 (OHLC delta-encoded)
      + getVolume(raw) x2 (vol, amount)
    Returns: OhlcBar[]
    Reference: pytdx/parser/get_security_bars.py

  mootdx-ts/src/protocol/index_bars.ts:
    Same request format as security_bars but different response parsing:
    Per-record: getDatetime() + getPrice() x4 (OHLC) + getVolume x2 + up_count(U16) + down_count(U16)
    Returns: (OhlcBar & { upCount: number; downCount: number })[]
    Reference: pytdx/parser/get_index_bars.py

  Both use delta-encoded prices relative to previous close, divided by 1000.
  Max 800 bars per request (MAX_KLINE_COUNT).
depends_on:
  - implement-login-heartbeat
