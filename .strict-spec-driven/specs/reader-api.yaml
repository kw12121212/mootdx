schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: ../schemas/main-spec.yaml
spec:
  id: reader-api
  title: Offline Reader API (StdReader / ExtReader)
mapping:
  implementation:
    - mootdx/reader.py
  tests: []
requirements:
  R-001:
    strength: MUST
    statement: "Reader.factory(market='std') returns StdReader; market='ext' returns ExtReader."
    scenarios: {}
  R-002:
    strength: MUST
    statement: "Constructor requires a valid tdxdir path; raises Exception if the directory does not exist."
    scenarios: {}
  R-003:
    strength: MUST
    statement: "StdReader.daily(symbol) reads .day files from vipdoc/{market}/lday/ and returns a pandas DataFrame."
    scenarios: {}
  R-004:
    strength: MUST
    statement: "StdReader.minute(symbol, suffix=1) reads 1-minute .lc1/.1 files; suffix=5 reads 5-minute .lc5/.5 files from vipdoc/{market}/minline or fzline."
    scenarios: {}
  R-005:
    strength: MUST
    statement: "find_path auto-detects market (sh/sz) from symbol prefix; symbols starting with '88' map to sh; '#' prefix maps to ds (extended)."
    scenarios: {}
  R-006:
    strength: MUST
    statement: "ExtReader.daily/minute/fzline read extended-market data files using TdxExHqDailyBarReader."
    scenarios: {}
  R-007:
    strength: MUST
    statement: "All reader methods return None when the data file is not found."
    scenarios: {}
